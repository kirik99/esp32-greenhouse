name: Validate HZAD S3 OTA
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/hzad-s3-cam-prod]
  push:
    branches: ['codex/s3-https-ota']
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/bridge/package-lock.json
      - run: npm ci
        working-directory: server/bridge
      - run: npm test
        working-directory: server/bridge
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.2.1 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'Adafruit BME280 Library' DallasTemperature OneWire 'ArduinoJson@7.4.2'
      - name: Build S3 with dummy credentials (never a deployable release)
        run: |
          cp growbox_s3_cam/wifi_config.example.h growbox_s3_cam/wifi_config.h
          arduino-cli compile --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc --warnings all growbox_s3_cam
      - name: Portable camera scheduler test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror growbox_s3_cam/test/camera_schedule_test.cpp -o /tmp/camera-test
          /tmp/camera-test
