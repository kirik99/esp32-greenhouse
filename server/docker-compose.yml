services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: growbox_mosquitto
    ports:
      - "1883:1883"
      - "127.0.0.1:9001:9001"
    environment:
      - MQTT_ESP32_USER=${MQTT_ESP32_USER:-growbox_esp32}
      - MQTT_ESP32_PASSWORD=${MQTT_ESP32_PASSWORD:-growbox_esp32_secret}
      - MQTT_BRIDGE_USER=${MQTT_BRIDGE_USER:-growbox_bridge}
      - MQTT_BRIDGE_PASSWORD=${MQTT_BRIDGE_PASSWORD:-growbox_bridge_secret}
      - MQTT_WEB_USER=${MQTT_WEB_USER:-growbox_web}
      - MQTT_WEB_PASSWORD=${MQTT_WEB_PASSWORD:-growbox_web_secret}
    entrypoint: >
      sh -c '
        mkdir -p /mosquitto/data;
        mosquitto_passwd -c -b /mosquitto/data/passwords.txt "$$MQTT_ESP32_USER" "$$MQTT_ESP32_PASSWORD";
        mosquitto_passwd -b /mosquitto/data/passwords.txt "$$MQTT_BRIDGE_USER" "$$MQTT_BRIDGE_PASSWORD";
        mosquitto_passwd -b /mosquitto/data/passwords.txt "$$MQTT_WEB_USER" "$$MQTT_WEB_PASSWORD";
        chown -R mosquitto:mosquitto /mosquitto/data;
        chmod 0700 /mosquitto/data;
        chmod 0600 /mosquitto/data/passwords.txt;
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
      '
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: growbox_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-adminpassword}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-growbox}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-sensors}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-growbox-super-secret-token}
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: unless-stopped

  bridge:
    build: ./bridge
    container_name: growbox_bridge
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_BRIDGE_USER:-growbox_bridge}
      - MQTT_PASSWORD=${MQTT_BRIDGE_PASSWORD:-growbox_bridge_secret}
      - MQTT_WEB_USER=${MQTT_WEB_USER:-growbox_web}
      - MQTT_WEB_PASSWORD=${MQTT_WEB_PASSWORD:-growbox_web_secret}
      - PUBLIC_TELEMETRY=true
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-growbox-super-secret-token}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-growbox}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-sensors}
      - BRIDGE_PORT=3001
      - IMAGES_DIR=/app/images
      - DATA_DIR=/app/data
      - ADMIN_PIN=${ADMIN_PIN}
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./bridge/images:/app/images
      - ./bridge/data:/app/data
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: growbox_dashboard
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - bridge
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
