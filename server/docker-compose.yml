services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: growbox_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: growbox_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=growbox
      - DOCKER_INFLUXDB_INIT_BUCKET=sensors
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=growbox-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: unless-stopped

  bridge:
    build: ./bridge
    container_name: growbox_bridge
    ports:
      - "3001:3001"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=growbox-super-secret-token
      - INFLUXDB_ORG=growbox
      - INFLUXDB_BUCKET=sensors
      - BRIDGE_PORT=3001
      - IMAGES_DIR=/app/images
      - TZ=Europe/Moscow
    volumes:
      - ./bridge/images:/app/images
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: growbox_dashboard
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
