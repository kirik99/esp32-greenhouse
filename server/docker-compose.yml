services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: growbox_mosquitto
    ports:
      - "1883:1883"
      - "8883:8883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: growbox_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-adminpassword}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-growbox}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-sensors}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-growbox-super-secret-token}
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: unless-stopped

  bridge:
    build: ./bridge
    container_name: growbox_bridge
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-growbox-super-secret-token}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-growbox}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-sensors}
      - BRIDGE_PORT=3001
      - IMAGES_DIR=/app/images
      - ADMIN_PIN=${ADMIN_PIN:-2212}
      - TZ=${TZ:-Europe/Moscow}
    volumes:
      - ./bridge/images:/app/images
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: growbox_dashboard
    ports:
      - "${WEB_PORT:-80}:80"
      - "${SSL_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - bridge
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
