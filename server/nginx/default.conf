# HTTP Configuration (Port 80)
server {
    listen 80;
    server_name _;
    client_max_body_size 6m;

    # Web Dashboard UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Stream exports without creating nginx temporary archive files.
    location ~ ^/api/photo-exports(?:/|$) {
        proxy_pass http://bridge:3001;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bridge REST API (/api/ -> http://bridge:3001/api/)
    location /api/ {
        proxy_pass http://bridge:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bridge health check
    location /health {
        proxy_pass http://bridge:3001/health;
        proxy_set_header Host $host;
    }

    # Mosquitto MQTT WebSockets (/mqtt -> ws://mosquitto:9001)
    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
