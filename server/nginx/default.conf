# HTTP Configuration (Port 80)
server {
    listen 80;
    server_name _;

    # Web Dashboard UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Bridge REST API (/api/ -> http://bridge:3001/api/)
    location /api/ {
        proxy_pass http://bridge:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bridge health check
    location /health {
        proxy_pass http://bridge:3001/health;
        proxy_set_header Host $host;
    }

    # Mosquitto MQTT WebSockets (/mqtt -> ws://mosquitto:9001)
    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# HTTPS Configuration (Port 443 - SSL / WSS)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Web Dashboard UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Bridge REST API (/api/ -> http://bridge:3001/api/)
    location /api/ {
        proxy_pass http://bridge:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bridge health check
    location /health {
        proxy_pass http://bridge:3001/health;
        proxy_set_header Host $host;
    }

    # Mosquitto MQTT Secure WebSockets (/mqtt -> wss)
    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}