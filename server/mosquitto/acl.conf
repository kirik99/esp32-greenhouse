# ==============================================================================
# Mosquitto Access Control List (ACL) for Growbox IoT
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ESP32 Firmware Client (growbox_esp32)
# - Publishes: environmental sensors telemetry, device status, and raw camera frames
# - Subscribes: relay toggle commands, camera capture trigger, CO2 zero calibration
# ------------------------------------------------------------------------------
user growbox_esp32
topic write growbox/sensors
topic write growbox/status
topic write growbox/image/raw
topic read growbox/relay/set
topic read growbox/camera/capture
topic read growbox/co2/calibrate

# ------------------------------------------------------------------------------
# 2. Node.js Server Bridge (growbox_bridge)
# - Ingests telemetry into InfluxDB and manages intelligent climate automation
# - Dispatches commands to ESP32 for relays, camera, CO2 calibration, and controller state
# ------------------------------------------------------------------------------
user growbox_bridge
topic read growbox/sensors
topic read growbox/status
topic read growbox/image/raw
topic write growbox/relay/set
topic write growbox/camera/capture
topic write growbox/co2/calibrate
topic write growbox/controller/state

# ------------------------------------------------------------------------------
# 3. Web Dashboard Client (growbox_web)
# - Strictly READ-ONLY subscriber for browser live monitoring
# - CANNOT publish to any topic (relay controls go through authenticated REST API)
# ------------------------------------------------------------------------------
user growbox_web
topic read growbox/sensors
topic read growbox/status
topic read growbox/controller/state
topic read growbox/image/raw
