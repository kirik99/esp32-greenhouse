# ==============================================================================
# Mosquitto Broker Configuration for Growbox IoT
# ==============================================================================

# Global security & authentication
allow_anonymous false
password_file /mosquitto/data/passwords.txt
acl_file /mosquitto/config/acl.conf

# Persistence
persistence true
persistence_location /mosquitto/data/

# Internal MQTT listener (for Bridge service & local Wi-Fi / LAN testing)
listener 1883

# WebSocket listener (internal, exposed externally as wss://.../mqtt via Nginx)
listener 9001
protocol websockets
